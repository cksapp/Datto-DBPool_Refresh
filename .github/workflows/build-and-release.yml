name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-release:
    name: Build and Create Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref }}'
          $version = $tag -replace '^refs/tags/v', ''
          
          # Validate version format
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Invalid version format: $version"
          }
          
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - uses: bjompen/UpdatePWSHAction@v1.0.3

      - name: Build module
        shell: pwsh
        run: ./build.ps1 -Bootstrap -Task Build

      - name: Create release archive
        shell: pwsh
        run: |
          $modulePath = "out/Datto.DBPool.Refresh/${{ steps.version.outputs.version }}"
          if (Test-Path $modulePath) {
            Compress-Archive -Path $modulePath -DestinationPath "Datto.DBPool.Refresh-${{ steps.version.outputs.version }}.zip" -Force
            Write-Host "Archive created: Datto.DBPool.Refresh-${{ steps.version.outputs.version }}.zip"
          } else {
            Write-Error "Module path not found: $modulePath"
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body: "Module version ${{ steps.version.outputs.version }} release"
          files: Datto.DBPool.Refresh-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
