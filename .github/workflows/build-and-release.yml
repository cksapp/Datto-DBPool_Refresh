name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Step 1: Run CI to ensure all checks pass before release
  ci:
    name: CI - Verify Code Quality
    uses: ./.github/workflows/ci.yml

  # Step 2: Only proceed with release if CI passes
  build-and-release:
    name: Create Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version source
        id: version-source
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
              $tagVersion = "${{ github.ref }}" -replace 'refs/tags/v', ''
              Write-Output "source=tag" >> $env:GITHUB_OUTPUT
              Write-Output "tag_version=$tagVersion" >> $env:GITHUB_OUTPUT
              Write-Host "✅ Triggered by tag: v$tagVersion"
          } else {
              Write-Output "source=manual" >> $env:GITHUB_OUTPUT
              Write-Host "✅ Triggered manually"
          }

      - name: Setup PowerShell
        shell: pwsh
        run: |
          pwsh -v

      - name: Bootstrap and build module
        shell: pwsh
        run: |
          ./build.ps1 -Bootstrap

      - name: Extract version from CHANGELOG
        id: version
        shell: pwsh
        run: |
          $changelogPath = './CHANGELOG.md'
          $changelogTagMatchRegEx = "^##\s\[(?<Version>(\d+\.){1,3}\d+)\]"
          $version = Get-Content $changelogPath | ForEach-Object {
              if ($_ -match $changelogTagMatchRegEx) {
                  return $matches.Version
              }
          } | Select-Object -First 1

          if (-not $version) {
              Write-Error "Could not extract version from CHANGELOG.md"
              exit 1
          }

          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "✅ Extracted CHANGELOG version: $version"

          # If triggered by tag, validate tag matches CHANGELOG
          $tagVersion = "${{ steps.version-source.outputs.tag_version }}"
          if ("${{ steps.version-source.outputs.source }}" -eq "tag" -and $tagVersion) {
              if ($tagVersion -ne $version) {
                  Write-Error @"
          ❌ Git tag version mismatch!

          Git tag version:      $tagVersion
             CHANGELOG version: $version

             The git tag must match the version in CHANGELOG.md
          "@
                  exit 1
              }
              Write-Host "✅ Git tag matches CHANGELOG version"
          }

      - name: Get previous release tag
        id: previous-tag
        shell: pwsh
        run: |
          try {
            $latestReleaseTag = gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>$null
          } catch {
            $latestReleaseTag = $null
          }

          if ($LASTEXITCODE -eq 0 -and $latestReleaseTag) {
            Write-Output "tag=$latestReleaseTag" >> $env:GITHUB_OUTPUT
            Write-Host "Previous release tag: $latestReleaseTag"
          } else {
            Write-Output "tag=" >> $env:GITHUB_OUTPUT
            Write-Host "No previous release found (first automated release)"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version and check for duplicates
        shell: pwsh
        run: |
          $currentVersion = "${{ steps.version.outputs.version }}"
          $previousTag = "${{ steps.previous-tag.outputs.tag }}"
          $tagName = "v$currentVersion"

          if ($previousTag -and $previousTag -eq $tagName) {
              Write-Host "[INFO] Previous release tag equals current tag; treating as first release"
              $previousTag = ""
          }

          # Check if version has changed from previous release
          if ($previousTag) {
              $previousVersion = $previousTag -replace '^v', ''

              if ($previousVersion -eq $currentVersion) {
                  Write-Error @"
          ❌ Version has not changed since last release!
             Current version: $currentVersion
             Last released:   $previousVersion

          Please update the version in:
             - CHANGELOG.md (add new section with format: ## [X.Y.Z] Release)
             - src/Datto.DBPool.Refresh.psd1 (update ModuleVersion)
          "@
                  exit 1
              }

              Write-Host "✅ Version updated: $previousVersion → $currentVersion"
          } else {
              Write-Host "✅ First release with version: $currentVersion"
          }

          # Check if GitHub release already exists
          $existingRelease = gh release view $tagName 2>&1
          if ($LASTEXITCODE -eq 0) {
              $releaseExistsMessage = @(
                "❌ Release already exists!",
                "   Version: $currentVersion",
                "   Tag: $tagName",
                "",
                "   A GitHub release for this version already exists.",
                "   You cannot publish the same version twice.",
                "",
                "   Please:",
                "   1. Increment the version in CHANGELOG.md and src/Datto.DBPool.Refresh.psd1",
                "   2. Create a new release with the incremented version"
              ) -join "`n"
              Write-Error $releaseExistsMessage
              exit 1
          } else {
              $global:LASTEXITCODE = 0
          }

          Write-Host "✅ No existing release found for $tagName"

          # Check if version exists in PSGallery
          try {
              $psGalleryModule = Find-Module -Name 'Datto.DBPool.Refresh' -RequiredVersion $currentVersion -ErrorAction SilentlyContinue
              if ($psGalleryModule) {
                  $psGalleryMessage = @(
                    "❌ Version already published to PSGallery!",
                    "   Version: $currentVersion",
                    "",
                    "   This version already exists in PowerShell Gallery.",
                    "   You cannot publish the same version twice.",
                    "",
                    "   Please increment the version in:",
                    "   - CHANGELOG.md",
                    "   - src/Datto.DBPool.Refresh.psd1"
                  ) -join "`n"
                  Write-Error $psGalleryMessage
                  exit 1
              }
              Write-Host "✅ Version $currentVersion not found in PSGallery (safe to publish)"
          } catch {
              Write-Host "[INFO] Could not check PSGallery (module may not be published yet): $_"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        id: release-notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $changelogPath = './CHANGELOG.md'

          # Extract release notes from CHANGELOG for this version
          $inVersionSection = $false
          $releaseNotes = @()
          $versionPattern = "^##\s\[$version\]"
          $nextVersionPattern = "^##\s\["

          Get-Content $changelogPath | ForEach-Object {
              if ($_ -match $versionPattern) {
                  $inVersionSection = $true
                  return
              }

              if ($inVersionSection) {
                  if ($_ -match $nextVersionPattern) {
                      $inVersionSection = $false
                      return
                  }

                  if (-not $releaseNotes -and [string]::IsNullOrWhiteSpace($_)) {
                      return
                  }

                  $releaseNotes += $_
              }
          }

          # If no CHANGELOG notes found, fall back to git log
          if (-not $releaseNotes) {
              Write-Host "[WARN] No release notes found in CHANGELOG for version $version, using git log"
              $previousTag = "${{ steps.previous-tag.outputs.tag }}"

              if ($previousTag) {
                  $gitNotes = & git log "${previousTag}..HEAD" --pretty=format:"- %s (%h)" --no-merges
                  if ($gitNotes) {
                      $releaseNotes = @("## Changes since $previousTag", "") + $gitNotes
                  } else {
                      $releaseNotes = @("No changes recorded")
                  }
              } else {
                  $releaseNotes = @("First release")
              }
          }

          $fullNotes = $releaseNotes -join "`n"
          $fullNotes = $fullNotes.TrimEnd()

          $fullNotes | Out-File -FilePath release-notes.txt -Encoding utf8

          Write-Host "[INFO] Release notes:"
          Write-Host "---------------------"
          Get-Content release-notes.txt
          Write-Host "---------------------"

      - name: Create archive of module version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $moduleName = "Datto.DBPool.Refresh"
          $sourceDir = Join-Path $moduleName $version
          $zipName = "$moduleName-$version.zip"

          if (Test-Path $sourceDir) {
            $stagingRoot = "release-staging"
            $stagingModuleDir = Join-Path $stagingRoot $moduleName
            $stagingVersionDir = Join-Path $stagingModuleDir $version

            Remove-Item $stagingRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $stagingVersionDir -Force | Out-Null

            Copy-Item -Path $sourceDir -Destination $stagingModuleDir -Recurse -Force

            Compress-Archive -Path $stagingModuleDir -DestinationPath $zipName -Force
            Write-Host "[SUCCESS] Created: $zipName"

            $archiveContents = Get-ChildItem $sourceDir -Recurse | Measure-Object
            Write-Host "Archive contains $($archiveContents.Count) files"

            Remove-Item $stagingRoot -Recurse -Force
          } else {
            Write-Error "[ERROR] Build output directory not found: $sourceDir"
            Write-Host "Available directories:"
            Get-ChildItem -Directory | Select-Object Name
            exit 1
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.version }}
          body_path: release-notes.txt
          files: ./Datto.DBPool.Refresh-${{ steps.version.outputs.version }}.zip
          tag_name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger documentation build
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'Build_DocsSite.yml',
              ref: 'main'
            });
            core.info('[SUCCESS] Triggered documentation build');

      - name: Trigger PowerShell Gallery publish
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish-psgallery.yml',
              ref: 'main'
            });
            core.info('[SUCCESS] Triggered PowerShell Gallery publish');
